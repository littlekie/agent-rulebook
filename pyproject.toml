[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rulebook"
version = "0.1.0"
description = "Seed repositories with shared AI engineering rules and review policies."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Agent Rulebook contributors"}]
keywords = ["agents", "cli", "code-review", "developer-tools", "repository"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/littlekie/agent-rulebook"
Issues = "https://github.com/littlekie/agent-rulebook/issues"
Changelog = "https://github.com/littlekie/agent-rulebook/blob/main/CHANGELOG.md"

[project.scripts]
agent-rulebook = "agent_rulebook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
agent_rulebook = ["data/**/*"]
